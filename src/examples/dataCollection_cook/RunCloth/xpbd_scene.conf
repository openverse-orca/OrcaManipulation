# XPBD 场景集中配置
#
# 新增场景或升级版本时，只需改这个文件，无需改动 ensure_xpbd_pip.py /
# ensure_xpbd_build.py / run_cloth_robot_p23c.sh 中的硬编码。
#
# 格式：KEY="value"（shell 可 source，Python 可解析）
# 环境变量同名时会覆盖这里的默认值（见各脚本的 os.environ.get 逻辑）。

# 默认 XPBD target 二进制名（对应 XPBD/build/<target> 和 pip 包 orcaxpbd_client/bin/<target>）
XPBD_DEFAULT_TARGET="dual_gripper_g1_cook2"

# 默认 orca-xpbd pip 版本号（TestPyPI / PyPI 上已发布的版本）
XPBD_DEFAULT_VERSION="26.8.1.5"