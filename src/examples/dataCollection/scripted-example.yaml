# 任务配置示例文件（默认：固定单物体，便于调 pose / 脚本抓放）
# 若需随机多物体，请使用 example_random_goods.yaml

level_name: "example"
type: "pick_and_place"

# 数据采集配置：仅记录/恢复前缀匹配的机器人关节，避免带随机 GUID 的 actor 关节导致回放失败
data_collection:
  agent_joint_prefix: "g1_omnipicker_"

# 仅保留啤酒瓶 bottle_blue；spawn 数量 nums [1,1] 且仅一项 → 每次只出现该物体
# six_dof.center 为 OrcaEngine 坐标系下放置中心；bound_* 全为 0 → 位置/姿态固定在中心（无随机）
# 相对原中心略减小 X，使瓶子更靠左、靠近机器人工作区，便于右臂抓取（若方向反了可略增大 X）
actor:
  names: ["bottle_blue"]
  spawnable:
    ["assets/e071469a36d3c8aa/default_project/shop_scene/prefabs/goods/bottle_blue"]
  joints: ["bottle_blue_joint"]
  joints_dof: [6]
  random:
    qpos: true
    nums: [1, 1]
    six_dof:
      center: [-6.45, 2.78, 1.10]
      bound_position: [[0, 0], [0, 0], [0, 0]]
      bound_rotation: [[0, 0], [0, 0], [0, 0]]

light:
  names: ["spotlight1"]
  spawnable: ["prefabs/spotlight"]
  random:
    position: false
    rotation: false
    center: [0, 0, 0]
    bound_position: [[-1, 1], [-1, 1], [0, 2]]
    bound_rotation: [[0, 3.14159], [0, 3.14159], [0, 3.14159]]
    nums: [1, 1]
    cycle: 20

task:
  type: "pick_and_place"
  goal:
    name: "basket"
    site: "basket_site"
