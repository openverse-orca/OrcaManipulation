# 商店场景配置文件（studio_shop）
# 【关键说明】当前actor配置已清空，原因：
# 1. OrcaStudio中未找到 shop_scene/prefabs/goods/* 商品资产
# 2. 使用 EmptyTask 替代 PickPlaceTask 进行纯机器人控制测试
# 
# 【恢复方法】当资产可用时：
# 1. 取消下方注释的 actor 配置
# 2. 将 gr3_collection_tele.py 中的 EmptyTask 改回 PickPlaceTask
# 3. 确保 OrcaStudio 中已导入对应商品资产

level_name: "studio_shop"

type: "pick_and_place"

# 【关键修改】actor配置已清空，避免"Spawnable name not found"错误
# 原始商店商品资产路径在当前OrcaStudio中不存在
actor:
  names: []           # 空列表：不生成任何物体
  spawnable: []        # 空列表：无资产路径
  joints: []           # 空列表：无关节
  joints_dof: []       # 空列表：无自由度
  random:
    qpos: false        # 关闭随机位置生成
    nums: [0, 0]       # 物体数量范围为0

light:
  names: ["spotlight1"]
  spawnable: ["prefabs/spotlight"]
  random:
    position: false
    rotation: false
    center: [0, 0, 0]
    bound_position: [[-1, 1], [-1, 1], [0, 2]]
    bound_rotation: [[0, 3.14159], [0, 3.14159], [0, 3.14159]]
    nums: [1, 1]
    cycle: 20  

task:
  type: "pick_and_place"
  goal:
    name: "basket"
    site: "basket_site"

