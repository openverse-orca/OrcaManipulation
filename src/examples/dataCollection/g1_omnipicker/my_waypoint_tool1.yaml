# 扳手 6 点路点（G1 OmniPicker base_body）
# 语义：接近 / 抓取 / 经由1 / 经由2 / 箱上方 / 松开

gripper_open: -0.8561
gripper_close: 2.0

segments:

  # 路点 1  接近（抓取）
  - steps: 300
    l_hold: true
    r_target_b: [0.5611, -0.0846, 0.1828]
    r_quat_b: [-0.4995, 0.4293, 0.5641, 0.4980]
    gripper_r: open

  # 路点 2  抓取闭爪
  - steps: 300
    l_hold: true
    r_target_b: [0.5579, -0.0842, 0.1810]
    r_quat_b: [-0.5041, 0.4411, 0.5608, 0.4865]
    gripper_r: close

  # 路点 3  放箱经由1
  - steps: 300
    l_hold: true
    r_target_b: [0.6788, -0.0182, 0.4808]
    r_quat_b: [-0.5427, -0.2961, 0.4458, 0.6473]
    gripper_r: close

  # 路点 4  放箱经由2
  - steps: 300
    l_hold: true
    r_target_b: [0.6690, 0.1026, 0.4191]
    r_quat_b: [-0.4673, -0.3541, 0.4946, 0.6415]
    gripper_r: close

  # 路点 5  工具箱上方 / 入箱前位
  - steps: 300
    l_hold: true
    r_target_b: [0.5867, 0.1902, 0.2037]
    r_quat_b: [-0.6557, -0.2457, 0.6428, 0.3107]
    gripper_r: close

  # 路点 6  箱上松开位
  - steps: 300
    l_hold: true
    r_target_b: [0.5864, 0.1904, 0.2046]
    r_quat_b: [-0.6526, -0.2458, 0.6444, 0.3138]
    gripper_r: open
