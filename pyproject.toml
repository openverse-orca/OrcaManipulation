[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-manipulation"
version = "0.1.0"
description = "OrcaManipulation - Manipulation tasks for OrcaGym"
requires-python = ">=3.10"
dependencies = ["orca-gym", "typing-extensions"]

[project.optional-dependencies]
# 实际安装见 README：pip install --no-deps ./third_party/lerobot 与 openpi-client
lerobot = []
inference = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["envs*", "examples*", "scene*", "conf*", "controllers*", "dataCollectionManager*", "dataStorage*", "devices*", "task*", "sensor*", "policy*", "trajectory*"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Third-party fork code follows upstream style, not enforced SLF001
exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I", "SLF001"]

[tool.ruff.lint.per-file-ignores]
# Test files allow white-box access
"tests/**" = ["SLF001"]
# __init__.py allows re-export
"**/__init__.py" = ["SLF001", "F401"]
# Auto-generated protobuf files
"**/grpc_stubs/*_pb2*.py" = ["SLF001"]
# Fluid fork code (from fluidmani branch) accesses MuJoCo internals for trajectory recording
"src/envs/fluid/sim_env.py" = ["SLF001"]
"src/envs/fluid/trajectory/trajectory_h5.py" = ["SLF001"]
"src/examples/dataCollection/utils/kettle_scene_helpers.py" = ["SLF001"]
"src/examples/dataCollection/utils/kettle_trajectory_driver.py" = ["SLF001"]
# LeRobot / camera / NVENC compatibility layer (third-party private APIs)
"src/dataStorage/lerobot_writer.py" = ["SLF001"]
"src/sensor/encoder_proc.py" = ["SLF001"]
"src/sensor/camera_stream.py" = ["SLF001"]
"src/controllers/pose_pin.py" = ["SLF001"]
# 示例脚本：先改 sys.path 再 import；约束模块访问仿真器内部状态
"src/examples/dataCollection/data_collection_tele_lerobot.py" = ["E402"]
"src/examples/dataCollection/data_collection_replay_lerobot.py" = ["E402"]
"src/examples/dataCollection/data_collection_scripted.py" = ["E402"]
"src/examples/dataCollection/data_collection_scripted_lerobot.py" = ["E402"]
"src/examples/inference/*.py" = ["E402"]
"src/examples/southgrid/**" = ["E402", "SLF001", "F401", "F841", "I001"]



