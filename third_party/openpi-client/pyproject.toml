[project]
name = "openpi-client"
version = "0.1.0+orca.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dm-tree==0.1.10",
    "msgpack==1.1.2",
    "numpy==2.2.6",
    "pillow==12.0.0",
    "typing-extensions==4.15.0",
    "websockets==16.0",
]

[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
dev-dependencies = ["pytest>=8.3.4"]

[tool.ruff]
line-length = 120
target-version = "py37"
